[project]
name = "n360ic-benchmark"
version = "0.1.0"
description = "Official code for the paper **'Neural 360° Image Compression: State-of-the-Art Benchmark and Perspectives'** by Giovanni Gaiardo and Thiago L.T. da Silveira, accepted at LASCAS 2027."
readme = "README.md"
authors = [{ name = "giovannigaiardo", email = "giovannigaiardo@hotmail.com" }]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
oslo = [
    "torch==2.4.0",
    "torchvision==0.19.0",
    "torch-geometric==2.6.1",
    "numpy<2",
    "opencv-python",
    "pirt",
    "healpy",
    "networkx",
    "compressai",
    "bjontegaard",
    "matplotlib",
    "pillow",
]

[tool.uv]
no-build-isolation-package = []

[tool.uv.sources]
torch = [{ index = "pytorch-cu121" }]
torchvision = [{ index = "pytorch-cu121" }]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
